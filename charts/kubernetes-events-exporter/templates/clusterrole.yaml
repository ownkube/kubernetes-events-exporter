{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubernetes-events-exporter.fullname" . }}
  labels:
    {{- include "kubernetes-events-exporter.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubernetes-events-exporter.fullname" . }}
  labels:
    {{- include "kubernetes-events-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubernetes-events-exporter.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubernetes-events-exporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
