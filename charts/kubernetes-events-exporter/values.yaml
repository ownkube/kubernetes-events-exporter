# Default values for kubernetes-events-exporter

replicaCount: 1

image:
  repository: ghcr.io/ownkube/kubernetes-events-exporter
  pullPolicy: IfNotPresent
  tag: ""  # defaults to appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  # Read access to events is always granted. The rules below add `get` on the
  # objects events are usually about, so each event can carry that object's
  # labels, annotations and owners. Secrets and ConfigMaps are left out on
  # purpose. Events about any other kind are still exported, without that
  # metadata. Add kinds (CRDs, for example) with extraRules, or replace the
  # list with rules. Neither is rendered when config.omitLookup is true.
  # When config.namespace is set, a Role in that namespace is created instead
  # of a ClusterRole, and cluster-scoped kinds (nodes, persistentvolumes) are
  # not readable.
  rules:
    - apiGroups: [""]
      resources:
        - pods
        - nodes
        - services
        - endpoints
        - persistentvolumeclaims
        - persistentvolumes
        - replicationcontrollers
        - namespaces
      verbs: ["get"]
    - apiGroups: ["apps"]
      resources: [deployments, replicasets, statefulsets, daemonsets]
      verbs: ["get"]
    - apiGroups: ["batch"]
      resources: [jobs, cronjobs]
      verbs: ["get"]
    - apiGroups: ["autoscaling"]
      resources: [horizontalpodautoscalers]
      verbs: ["get"]
    - apiGroups: ["policy"]
      resources: [poddisruptionbudgets]
      verbs: ["get"]
    - apiGroups: ["networking.k8s.io"]
      resources: [ingresses]
      verbs: ["get"]
    - apiGroups: ["discovery.k8s.io"]
      resources: [endpointslices]
      verbs: ["get"]
  extraRules: []
    # - apiGroups: ["cert-manager.io"]
    #   resources: [certificates]
    #   verbs: ["get"]

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "2112"
  prometheus.io/path: "/metrics"

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 200m
  #   memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Metrics service (for ServiceMonitor / Prometheus scraping)
service:
  enabled: true
  port: 2112

serviceMonitor:
  enabled: false
  # interval: 30s
  # additionalLabels: {}

# Leader election for HA deployments. Sets config.leaderElection.enabled and
# creates a Role for the lease in the release namespace.
leaderElection:
  enabled: false

# Extra environment variables (useful for secrets)
extraEnv: []
  # - name: ELASTIC_API_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: elastic-secret
  #       key: api-key

# Extra volumes and volume mounts (for TLS certs, etc.)
extraVolumes: []
extraVolumeMounts: []

# -------------------------------------------------------
# Event exporter configuration
# This becomes the config.yaml ConfigMap
# -------------------------------------------------------
config:
  logLevel: info
  logFormat: json
  maxEventAgeSeconds: 60
  metricsNamePrefix: "event_exporter_"
  # clusterName: ""
  # clusterEnvironment: ""
  # kubeQPS: 100
  # kubeBurst: 500

  route:
    routes:
      - match:
          - receiver: "dump"

  receivers:
    - name: "dump"
      stdout: {}
